[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capital-growth-demo"
version = "1.0.0"
description = "Educational compound-interest CLI and CI/CD demonstration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "bandit>=1.8", "pip-audit>=2.7", "build>=1.2", "twine>=6"]

[project.scripts]
capital-growth = "capital_growth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py311"
